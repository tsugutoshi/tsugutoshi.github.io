<!DOCTYPE html>
<html lang="ja">
<head>
  <base href="/luminadia/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Luminadia（ルミナディア）は、今日の数字・カラー・シンボルから毎日のヒントを見つける開運数秘術アプリです。">
  <meta name="theme-color" content="#FBF8EE">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Luminadia">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>Luminadia − 開運数秘術 日運数アプリ</title>
  <style>
    html, body { margin: 0; background: #FBF8EE; color: #254F50; }
    #loading { min-height: 100vh; display: grid; place-content: center; text-align: center; padding: 0 24px; font-family: serif; }
    #loading h1 { color: #C39A46; font-size: 36px; font-style: italic; font-weight: normal; margin: 0 0 16px; }
    #loading p { font-size: 16px; line-height: 1.8; }
  </style>
</head>
<body>
  <div id="loading" role="status">
    <h1>Luminadia</h1>
    <p>今日の数字を、毎日のヒントに。<br>読み込んでいます…</p>
  </div>
  <noscript>このアプリを利用するには、ブラウザーのJavaScriptを有効にしてください。</noscript>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      document.getElementById('loading')?.remove();
    }, { once: true });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
